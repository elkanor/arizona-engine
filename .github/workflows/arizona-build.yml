name: Build Arizona Engine
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;29.0.13846066"
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete arizona-latest -y --cleanup-tag || true
          gh release create arizona-latest app/build/outputs/apk/release/*.apk \
            -t "Arizona Engine (latest)" -n "Test build"
